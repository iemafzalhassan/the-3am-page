apiVersion: apps/v1
kind: Deployment
metadata: { name: checkout-api, labels: { app: checkout-api } }
spec:
  replicas: 2                     # two pods → now `sum by` really matters
  selector: { matchLabels: { app: checkout-api } }
  template:
    metadata: { labels: { app: checkout-api } }
    spec:
      containers:
        - name: app
          image: ghcr.io/iemafzalhassan/checkout-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: checkout-api, labels: { app: checkout-api } }
spec:
  type: NodePort
  selector: { app: checkout-api }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: ghcr.io/iemafzalhassan/checkout-api:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "loadgen.py"]
          env: [{ name: TARGET, value: "http://checkout-api:8080" }]
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 96Mi } }
