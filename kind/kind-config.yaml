kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: the-3am-page
nodes:
  - role: control-plane
    extraPortMappings:            # NodePorts → localhost
      - { containerPort: 30080, hostPort: 18080, listenAddress: "127.0.0.1" }   # checkout-api
      - { containerPort: 30090, hostPort: 19090, listenAddress: "127.0.0.1" }   # Prometheus
      - { containerPort: 30030, hostPort: 13000, listenAddress: "127.0.0.1" }   # Grafana
