groups:
  - name: checkout
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} is not answering scrapes"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{route="/checkout", status=~"5.."}[1m]))
            /
          sum(rate(http_requests_total{route="/checkout"}[1m])) > 0.05
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "More than 5% of checkouts are failing"
          runbook_url: "https://wiki/runbooks/checkout-errors"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (le) (
            rate(http_request_duration_seconds_bucket{route="/checkout"}[1m])
          )) > 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Checkout p99 is above 1s"
          runbook_url: "https://wiki/runbooks/checkout-latency"
